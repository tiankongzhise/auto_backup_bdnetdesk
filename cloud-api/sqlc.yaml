version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/postgres"
    queries:
      - "internal/cloudapi/queries"
    gen:
      go:
        package: "db"
        out: "internal/cloudapi/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true

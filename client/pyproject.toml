[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-backup-bdnetdesk-client"
version = "0.1.0"
description = "Windows client for encrypted Baidu Netdisk backups."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "cryptography>=42,<47",
    "httpx>=0.27,<1",
    "pywebview>=6,<7",
    "qrcode[pil]>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
    "pytest>=8,<10",
]

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Backup BD Netdisk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AB</div>
          <div>
            <div class="brand-title">Auto Backup</div>
            <div class="brand-subtitle">BD Netdisk</div>
          </div>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item is-active" type="button" data-route="dashboard">工作台</button>
          <button class="nav-item" type="button" data-route="jobs">备份</button>
          <button class="nav-item" type="button" data-route="baidu">百度授权</button>
          <button class="nav-item" type="button" data-route="restore">恢复</button>
          <button class="nav-item" type="button" data-route="cleanup">清理</button>
          <button class="nav-item" type="button" data-route="reconcile">校对与同步</button>
          <button class="nav-item" type="button" data-route="settings">设置</button>
        </nav>
        <div class="sidebar-status" id="sidebar-status">正在连接 bridge</div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <div>
            <div class="eyebrow" id="view-eyebrow">工作台</div>
            <h1 id="view-title">工作台</h1>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <section class="content" id="view-root" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
